<!doctype html><meta charset="utf-8"><title>Logo variants</title>
<style>
  :root{--ink:#17181b;--paper:#f4f1ea}
  body{margin:0;background:var(--paper);font-family:ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:32px}
  .cell{text-align:center}
  .cell svg{width:100%;height:auto;display:block}
  .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-top:8px}
  .row2{display:flex;gap:34px;align-items:center;padding:0 32px 40px}
  .row2 .s{width:104px}.row2 .m{width:56px}.row2 .t{width:30px}
  text{font-family:"Arial Black","Helvetica Neue",Helvetica,sans-serif;font-weight:900}
</style>

<div class="grid">

</div>
